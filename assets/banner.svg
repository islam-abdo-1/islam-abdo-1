  <text x="72" y="352" fill="#475569" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1">github.com/islam-abdo-1</text>
  <text x="1208" y="352" fill="#475569" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="end" letter-spacing="1">EGYPT · OPEN TO REMOTE</text>
