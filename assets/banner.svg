  <circle cx="1080" cy="80" r="260" fill="url(#glow1)"/>
  <circle cx="220" cy="360" r="240" fill="url(#glow2)"/>

  <rect x="24" y="24" width="1232" height="352" rx="24" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <path d="M24 96V48a24 24 0 0 1 24-24h56" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <path d="M1256 304v48a24 24 0 0 1-24 24h-56" fill="none" stroke="url(#accent)" stroke-width="2"/>

  <text x="72" y="112" fill="#38BDF8" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="4">AI DEVELOPER &amp; FULL-STACK ENGINEER</text>
  <text x="68" y="196" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">Islam Abdo</text>
  <text x="72" y="242" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19">Building AI-driven products and SaaS platforms — from idea to production.</text>

