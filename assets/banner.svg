    <text x="92" y="306">Python</text>
    <rect x="172" y="286" width="72" height="30" rx="15" fill="#0F172A" stroke="#1E293B"/>
    <text x="192" y="306">React</text>
    <rect x="256" y="286" width="88" height="30" rx="15" fill="#0F172A" stroke="#1E293B"/>
    <text x="276" y="306">FastAPI</text>
    <rect x="356" y="286" width="88" height="30" rx="15" fill="#0F172A" stroke="#1E293B"/>
    <text x="376" y="306">Next.js</text>
    <rect x="456" y="286" width="120" height="30" rx="15" fill="#0F172A" stroke="#1E293B"/>
    <text x="476" y="306">PostgreSQL</text>
    <rect x="588" y="286" width="112" height="30" rx="15" fill="#0F172A" stroke="#1E293B"/>
    <text x="608" y="306">Cloudflare</text>
