      <text x="300" y="82" fill="#475569" font-size="10" text-anchor="end">LLM · ML · AUTOMATION</text>

      <rect x="24" y="106" width="296" height="38" rx="8" fill="#0F172A" stroke="#1E3A8A"/>
      <text x="40" y="130" fill="#60A5FA" font-size="12">API / BACKEND</text>
      <text x="300" y="130" fill="#475569" font-size="10" text-anchor="end">FASTAPI · NODE · AUTH</text>

      <rect x="24" y="154" width="296" height="38" rx="8" fill="#0F172A" stroke="#312E81"/>
      <text x="40" y="178" fill="#818CF8" font-size="12">DATA / STORAGE</text>
      <text x="300" y="178" fill="#475569" font-size="10" text-anchor="end">POSTGRES · SUPABASE</text>

      <rect x="24" y="202" width="296" height="30" rx="8" fill="#0F172A" stroke="#334155"/>
      <text x="40" y="222" fill="#94A3B8" font-size="12">CLOUD / DELIVERY</text>
      <text x="300" y="222" fill="#475569" font-size="10" text-anchor="end">VERCEL · CLOUDFLARE</text>

      <path d="M172 96V106" stroke="#334155" stroke-width="1.5"/>
      <path d="M172 144V154" stroke="#334155" stroke-width="1.5"/>
      <path d="M172 192V202" stroke="#334155" stroke-width="1.5"/>
    </g>

    <path d="M0 24V12A12 12 0 0 1 12 0h12" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <path d="M344 224v12a12 12 0 0 1-12 12h-12" fill="none" stroke="#818CF8" stroke-width="2"/>
